name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Triggered by pushing a version tag:    git tag v0.3.0 && git push origin v0.3.0
#
# What it does (in order):
#   1. Builds System Compass once (platform-independent static bundle)
#   2. Builds + packages a CLI tarball PER PLATFORM on a NATIVE runner, so each
#      tarball's node_modules contains binaries compiled for that platform/arch
#   3. Creates a GitHub Release with all assets + install instructions
#   4. Updates the Homebrew formula with the new SHA and opens a PR
#
# Why native per-platform builds:
#   node-tree-sitter 0.25 ships NO prebuilds and is compiled from source at
#   `npm ci`. Packaging all platforms from one amd64 runner would copy a single
#   linux-x64 core binary into every tarball, breaking the CLI on macOS, Windows
#   and linux-arm64. Each platform must build its own native binding.
#
# Note: The Scala backend (memory-layer) is built and released separately
# from the private Ix-memory repo. Docker images are pushed to
# ghcr.io/ix-infrastructure/ix-memory-layer from that repo.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"
  # Packaging dry-run: on PRs that touch the packaging surface, run the full
  # per-platform build + package matrix (no publish) so a broken release leg is
  # caught before tagging instead of mid-release.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/install/**"
      - "ix-cli/package.json"
      - "ix-cli/package-lock.json"
      - "core-ingestion/package.json"
      - "core-ingestion/package-lock.json"
      - "docker-compose.standalone.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.9)"
        required: true
      dry_run:
        description: "Build + package on all platforms only; skip publishing the release and the Homebrew PR"
        type: boolean
        default: false

# Least privilege at the top; the release job elevates to what it needs.
permissions:
  contents: read

jobs:
  # ── 1. Build System Compass once (platform-independent) ───────────────────
  # Skipped on PR dry-runs (compass needs a private-repo token; the package step
  # treats a missing compass bundle as best-effort anyway).
  compass:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      # The system-compass commit this bundle was built from. Recorded in the
      # bundle's .version stamp so a build is identifiable after the fact —
      # system-compass's package.json version is not maintained against the
      # ix-compass-dist release series (it read 0.2.0 while dist was on v0.3.0),
      # so the commit is the only reliable identity the bundle has.
      sha: ${{ steps.build-compass.outputs.sha }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14"

      # No continue-on-error. It previously swallowed the clone's exit 128 *and*
      # the explicit ::error:: guard below, so an expired COMPASS_TOKEN produced
      # a fully green release that shipped an empty compass/ directory and a
      # broken `ix view` for every user. A compass failure must fail the release.
      - name: Build System Compass
        id: build-compass
        env:
          COMPASS_TOKEN: ${{ secrets.COMPASS_TOKEN }}
        run: |
          mkdir -p compass-dist
          if [ -z "$COMPASS_TOKEN" ]; then
            echo "::error::COMPASS_TOKEN is not set. It is required to build System Compass from the private ix-infrastructure/system-compass repo. Add a fine-grained PAT with Contents:read on that repo as the COMPASS_TOKEN secret."
            exit 1
          fi
          # Belt and braces. A `secrets.*` value is masked automatically, so this
          # is redundant today — but that guarantee is tied to where the value
          # came from. If COMPASS_TOKEN is ever re-sourced from `vars.*`, a step
          # output, or an App token minted in-job, the automatic mask silently
          # stops applying. This line does not care about the source.
          echo "::add-mask::$COMPASS_TOKEN"
          # Do not pipe this clone through a redaction filter. This job runs on
          # the runner's default `bash -e {0}`, which has no `pipefail`, so the
          # pipeline would exit with the filter's status (0) and the guard below
          # could never fire — the failure would surface as a confusing `cd:
          # system-compass: No such file or directory` two lines down instead of
          # the message telling you to rotate the token. Git withholds the
          # credential from its own error output regardless, and the mask above
          # covers the value if anything else ever echoes it.
          git clone "https://x-access-token:${COMPASS_TOKEN}@github.com/ix-infrastructure/system-compass.git" 2>&1 \
            || {
              echo "::error::Could not clone ix-infrastructure/system-compass. COMPASS_TOKEN is set but was rejected — it is most likely expired or lacks Contents:read on that repo. Rotate it and re-run."
              exit 1
            }
          cd system-compass
          # Capture the source commit before building, so the stamp written in
          # the package job can identify this bundle (see the job's `outputs`).
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          npm ci --legacy-peer-deps
          npm run build
          if [ ! -f dist/index.html ]; then
            echo "::error::Compass build did not produce dist/index.html"
            exit 1
          fi
          cp -r dist/* "$GITHUB_WORKSPACE/compass-dist/"
          # Prove the artifact is real before it is uploaded, so a silent
          # partial build cannot reach the packaging step.
          test -f "$GITHUB_WORKSPACE/compass-dist/index.html" \
            || { echo "::error::compass-dist/index.html missing after copy"; exit 1; }
          echo "compass bundle: $(find "$GITHUB_WORKSPACE/compass-dist" -type f | wc -l) files"

      - name: Upload compass bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compass-dist
          path: compass-dist
          include-hidden-files: true
          retention-days: 1

  # ── 2. Build + package one tarball per platform on a native runner ────────
  build:
    name: Package (${{ matrix.target }})
    needs: compass
    # Run on tag releases (compass succeeded) and on PR dry-runs (compass skipped).
    if: ${{ always() && needs.compass.result != 'failure' && needs.compass.result != 'cancelled' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS (darwin-amd64 / macos-13) is intentionally omitted: those
        # runners are being retired and queue indefinitely, which would stall the
        # release job (it waits on every build leg). Apple-Silicon macOS covers
        # current Macs. Re-add a `darwin-amd64` entry if/when macos-13 is reliable.
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-14
          - target: windows-amd64
            # Pinned to windows-2022: windows-latest ships Visual Studio 18,
            # which node 22's bundled node-gyp cannot detect, breaking the
            # native tree-sitter compile. VS2022 is the supported toolchain.
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Dry-run: no real tag. Use a valid placeholder semver for `npm version`.
            echo "version=0.0.0-pr" >> "$GITHUB_OUTPUT"
          else
            TAG="${INPUT_TAG:-$REF_NAME}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14"
          cache: "npm"
          cache-dependency-path: ix-cli/package-lock.json

      # node-tree-sitter 0.25's binding.gyp self-specifies C++17 on every
      # platform; node 22's V8 headers compile that cleanly with no override.
      # (The C++20 flag in ci.yml exists only because CI runs node 24.)
      - name: Build core-ingestion (native compile)
        working-directory: core-ingestion
        run: npm ci --silent

      - name: Build CLI
        working-directory: ix-cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci --silent
          npm run build
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Drop the build toolchain before anything reads node_modules. `npm run
      # build` above has already consumed it, and every later step only copies
      # or scans files, so nothing downstream needs it.
      #
      # --omit=dev keeps `dependencies` AND `optionalDependencies`, so all 27
      # tree-sitter grammars (13 required + 14 optional) survive — they are
      # genuine runtime deps and the parser is useless without them. Only
      # devDependencies go.
      #
      # This also tightens the SBOM below for `ix-cli`, which until now described
      # the build toolchain as shipped content. Note the SBOM still scans only
      # `ix-cli`; core-ingestion's runtime tree is shipped but not catalogued.
      - name: Prune dev dependencies before packaging
        run: |
          # `|| true`: this step runs under `bash -eo pipefail`, so a non-zero du
          # anywhere in the pipeline would abort the whole release. Reporting a
          # size is not worth that, and the `:-?` fallbacks below only mean
          # something if the failure is allowed to reach them.
          size() { du -sm "$1" 2>/dev/null | cut -f1 | head -1 || true; }
          before_cli=$(size ix-cli/node_modules)
          before_ing=$(size core-ingestion/node_modules)
          (cd ix-cli && npm prune --omit=dev)
          (cd core-ingestion && npm prune --omit=dev)
          echo "ix-cli/node_modules:         ${before_cli:-?} MB -> $(size ix-cli/node_modules) MB"
          echo "core-ingestion/node_modules: ${before_ing:-?} MB -> $(size core-ingestion/node_modules) MB"

          # The CLI must still start from the pruned tree, or the tarball ships
          # broken. `--version` only resolves the eager import graph, so it
          # proves nothing about core-ingestion: the CLI reaches that through a
          # dynamic import in ingestion-loader.ts and would fail first on a
          # user's `ix map`, long after this step went green.
          #
          # So actually parse something. A grammar dropped by mistake makes
          # parseFile return null here rather than at a user's first ingest.
          # (parse-worker.js is deliberately not imported — it throws by design
          # unless it is running inside a worker thread.)
          node ix-cli/dist/cli/main.js --version
          node --input-type=module -e "
            const { parseFile } = await import('./core-ingestion/dist/index.js');
            await import('./core-ingestion/dist/patch-builder.js');
            const result = parseFile('smoke.ts', 'export const smoke = 1;\n');
            if (!result) throw new Error('core-ingestion parsed nothing from the pruned tree');
            console.log('core-ingestion parses from the pruned tree');
          "

      # The compass job does not run on PR dry-runs, so the artifact is legitimately
      # absent there. continue-on-error covers only that case; a real release
      # asserts the bundle is present in the packaging step below.
      - name: Download compass bundle
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compass-dist
          path: compass-dist

      - name: Package CLI (${{ matrix.target }})
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          RUNNER_OS: ${{ runner.os }}
          # A PR dry-run skips the compass job, so an absent bundle is expected
          # there and only there.
          REQUIRE_COMPASS: ${{ github.event_name != 'pull_request' }}
          # Empty on a PR dry-run (the compass job is skipped); the stamp falls
          # back to `unknown`, which is fine because no bundle is staged either.
          COMPASS_SHA: ${{ needs.compass.outputs.sha }}
        run: |
          STAGING="ix-${VERSION}-${TARGET}"
          # Compute the checksum with node (always present on every runner);
          # `shasum` is missing from the bash shell on GitHub's Windows image.
          sha256file() {
            node -e "const c=require('crypto'),f=require('fs'),p=process.argv[1];process.stdout.write(c.createHash('sha256').update(f.readFileSync(p)).digest('hex')+'  '+p+'\n')" "$1"
          }
          COMPASS_STAGED=0
          ARCHIVE_LIST="$(mktemp)"
          trap 'rm -f "$ARCHIVE_LIST"' EXIT
          mkdir -p "$STAGING/cli" "$STAGING/core-ingestion" "$STAGING/compass"
          cp -rL ix-cli/dist ix-cli/node_modules ix-cli/package.json "$STAGING/cli/"
          cp -rL core-ingestion/dist core-ingestion/node_modules core-ingestion/package.json "$STAGING/core-ingestion/"
          if [ -f compass-dist/index.html ]; then
            cp -r compass-dist/* "$STAGING/compass/"
            # Stamp the bundle with the release it ships in, so it declares its
            # own provenance instead of relying on whoever unpacks it to guess.
            #
            # Without this the bundled compass is unversioned, so
            # getInstalledCompassVersion() reads 0.0.0 and `ix upgrade` treats a
            # compass it just shipped as "not installed" — then replaces it with
            # whatever ix-compass-dist has, which is older than the bundle built
            # from compass main at release time. v0.9.0 shipped exactly that: on
            # Windows an unrelated tar failure masked it, and everywhere else the
            # swap succeeded and silently reverted the map to a June build.
            #
            # The `+release.<sha>` marker is load-bearing, not decoration. This
            # bundle is built from system-compass main and has no
            # ix-compass-dist release number, so the version recorded here is an
            # *Ix* version. install.sh and the compass-upgrade path write the
            # same file with a *dist* version. Until v0.9.2 the stamp was a bare
            # number with no way to tell the two apart, so
            # `isNewer(distLatest, stamp)` compared two unrelated series and was
            # correct only while Ix's numbers happened to be the larger ones —
            # the first dist tag above the running Ix version would have
            # replaced this newer bundle with an older dist build (Ix#376). The
            # marker lets the CLI skip the comparison entirely for release
            # bundles, which is the only correct answer: a dist release
            # published after this one arrives with the next Ix release, which
            # bundles main again.
            #
            # ONE LINE, and semver build metadata rather than key=value. This
            # file has readers we cannot upgrade: every already-shipped CLI
            # reads it with `readFileSync(...).trim()` — the whole file — and
            # feeds that to splitVersion. A multi-line stamp makes the major
            # parse as NaN -> 0, so an old CLI sees a 1.x release as [0,0,0] and
            # downloads ix-compass-dist over the newer bundle it just installed:
            # Ix#376 again, reintroduced by the format change, on exactly the
            # upgrade that ships the fix. splitVersion drops everything after
            # `+`, so old CLIs read this as a plain "$VERSION" and behave as
            # they do today. Do not add a second line, and do not drop the `+`.
            printf '%s+release.%s\n' \
              "$VERSION" "${COMPASS_SHA:-unknown}" > "$STAGING/compass/.version"
            test -s "$STAGING/compass/.version" \
              || { echo "::error::failed to stamp $STAGING/compass/.version"; exit 1; }
            COMPASS_STAGED=1
            echo "compass: $(find "$STAGING/compass" -type f | wc -l) files staged, stamped $VERSION"
          elif [ "$REQUIRE_COMPASS" = "true" ]; then
            # v0.7.0 through v0.8.1 all shipped an empty compass/ because this
            # was a silent no-op. `ix view` then fails for every user with
            # "Compass UI not found". Refuse to publish that.
            echo "::error::compass bundle is missing — refusing to publish a release whose compass/ directory is empty, which breaks 'ix view' for every user. Check the compass job above."
            exit 1
          else
            echo "::notice::compass bundle absent (PR dry-run) — packaging without it"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > "$STAGING/ix.cmd" <<'WRAPPER'
          @echo off
          node "%~dp0cli\dist\cli\main.js" %*
          WRAPPER
            7z a -tzip "$STAGING.zip" "$STAGING" >/dev/null
            # Verify the stamp survived archiving rather than trusting the tool
            # to carry a dot-named file. If it is ever dropped, every upgrade
            # silently reverts the compass — a failure with no error to notice.
            #
            # Listed to a file rather than piped into `grep -q`: this shell runs
            # with `pipefail`, and grep -q exits at the first match, so the
            # lister gets SIGPIPE and the pipeline reports *its* failure. That
            # turns the check into a race the archiver usually wins and
            # sometimes does not — it failed exactly once across four platforms.
            7z l "$STAGING.zip" > "$ARCHIVE_LIST"
            if [ "$COMPASS_STAGED" = "1" ] && ! grep -q '\.version' "$ARCHIVE_LIST"; then
              echo "::error::compass/.version is missing from $STAGING.zip — 7z dropped the dot-named stamp, which makes every 'ix upgrade' replace the bundled compass with an older one."
              exit 1
            fi
            sha256file "$STAGING.zip" > "$STAGING.zip.sha256"
          else
            cat > "$STAGING/ix" <<'WRAPPER'
          #!/bin/sh
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          exec node "$SCRIPT_DIR/cli/dist/cli/main.js" "$@"
          WRAPPER
            chmod +x "$STAGING/ix"
            tar -czf "$STAGING.tar.gz" "$STAGING"
            # See the note on the zip branch: listed to a file, not piped into
            # `grep -q`, because pipefail turns the lister's SIGPIPE into a
            # spurious failure of this check.
            tar -tzf "$STAGING.tar.gz" > "$ARCHIVE_LIST"
            if [ "$COMPASS_STAGED" = "1" ] && ! grep -q 'compass/\.version' "$ARCHIVE_LIST"; then
              echo "::error::compass/.version is missing from $STAGING.tar.gz — without it every 'ix upgrade' replaces the bundled compass with an older one."
              exit 1
            fi
            sha256file "$STAGING.tar.gz" > "$STAGING.tar.gz.sha256"
          fi

      - name: Generate SBOM (${{ matrix.target }})
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ix-cli
          format: spdx-json
          output-file: ix-${{ steps.version.outputs.version }}-${{ matrix.target }}.sbom.spdx.json
          artifact-name: sbom-${{ matrix.target }}.spdx.json

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ix-${{ matrix.target }}
          path: |
            ix-*-${{ matrix.target }}.tar.gz
            ix-*-${{ matrix.target }}.tar.gz.sha256
            ix-*-${{ matrix.target }}.zip
            ix-*-${{ matrix.target }}.zip.sha256
            ix-*-${{ matrix.target }}.sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  # ── 3 + 4. Collect artifacts, create the Release, update Homebrew ─────────
  # Skipped entirely on a dry run: the build matrix above still validates every
  # platform's native compile + packaging, but nothing is published.
  release:
    needs: build
    if: ${{ !inputs.dry_run && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write # create the release + push the brew branch
      pull-requests: write # open the brew formula PR
      id-token: write # keyless signing for provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      - name: Checkout
        # Credentials are intentionally persisted here: the Homebrew step pushes a
        # branch and opens a PR with this token (see .github/zizmor.yml).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A semver pre-release identifier (0.9.0-rc.1, 1.0.0-beta.2) marks this
          # as not-for-general-consumption. Everything below keys off it.
          case "$VERSION" in
            *-*) PRERELEASE=true  ;;
            *)   PRERELEASE=false ;;
          esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          # The banner that leads a release candidate's own release page.
          #
          # Built here rather than inline in the release body because it needs
          # real newlines for the fenced blocks, and an Actions expression
          # cannot produce one: `format()` strings have no escape sequences, so
          # a `\n` in there is emitted as a literal backslash-n. Empty for a
          # stable release, which leaves the body starting at "## Install".
          {
            echo "banner<<IX_BANNER_EOF"
            if [ "$PRERELEASE" = "true" ]; then
              cat <<EOF
          > **Release candidate — the install commands further down will NOT give you this build.**
          > \`/releases/latest\` deliberately excludes prereleases and still points
          > at the last stable release, so both installers resolve to that unless
          > you pin the version. Use one of these instead:
          >
          > \`\`\`bash
          > # macOS / Linux
          > curl -fsSL https://raw.githubusercontent.com/${REPO}/main/scripts/install/install.sh | IX_VERSION=${VERSION} bash
          > \`\`\`
          >
          > \`\`\`powershell
          > # Windows
          > \$env:IX_VERSION="${VERSION}"; irm https://raw.githubusercontent.com/${REPO}/main/scripts/install/install.ps1 | iex
          > \`\`\`
          >
          > On the bash line \`IX_VERSION=\` must sit on \`bash\`, not on \`curl\`: an
          > assignment prefixing \`curl\` applies to that command alone and never
          > reaches the installer on the other side of the pipe.
          >
          > Homebrew cannot install a release candidate — the formula tracks
          > stable releases only.
          EOF
            fi
            echo "IX_BANNER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all platform tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: _artifacts
          pattern: ix-*
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "_artifacts/*.tar.gz,_artifacts/*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Without this, a v0.9.0-rc.1 tag publishes as a normal release and
          # becomes "latest" — and both install.sh's resolve_version() and the
          # CLI's checkForUpdate() read /releases/latest, so an RC would install
          # itself onto every new user and prompt every existing one to upgrade
          # to it. GitHub excludes prereleases from /releases/latest, so this is
          # what makes a release-candidate tag safe to push at all.
          #
          # `legacy`, not `true` and not omitted.
          #
          # Omitting it does NOT mean "leave the pointer alone": the action's
          # parseMakeLatest returns undefined for an absent input, the key is
          # dropped from the payload, and GitHub's REST default of `true`
          # applies on PATCH as well as POST. Since this job also runs on
          # workflow_dispatch against an arbitrary tag — where the action
          # *updates* an existing release — both `true` and omitted would
          # re-point /releases/latest at whatever old tag was re-run.
          #
          # `legacy` asks GitHub to pick latest by date and semver instead, so
          # re-running v0.8.1 after v0.9.0 has shipped leaves the pointer where
          # it belongs. Prereleases stay pinned to `false`.
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          body: |
            ${{ steps.version.outputs.banner }}

            ## Install

            ### Quick install (no repo needed)
            ```bash
            # macOS / Linux
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install/install.sh | bash

            # Windows (PowerShell)
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install/install.ps1 | iex

            # Homebrew
            brew tap ${{ github.repository_owner }}/ix https://github.com/${{ github.repository }}
            brew install ix
            ix docker start
            ```

            ### Docker image
            ```bash
            docker pull ghcr.io/ix-infrastructure/ix-memory-layer:latest
            ```
          files: |
            _artifacts/*.tar.gz
            _artifacts/*.tar.gz.sha256
            _artifacts/*.zip
            _artifacts/*.zip.sha256
            _artifacts/*.sbom.spdx.json

      - name: Update Homebrew formula
        # Never point the formula at a release candidate — `brew install ix`
        # should track stable versions only.
        if: ${{ steps.version.outputs.prerelease == 'false' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          TARBALL_URL="https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)

          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" Formula/ix.rb
          sed -i "s|# sha256 .*|sha256 \"${SHA256}\"|; s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/ix.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/brew-update-v${VERSION}"
          git checkout -b "$BRANCH"
          git add Formula/ix.rb
          # `chore(brew):`, not `brew:` — pr-title.yml runs
          # action-semantic-pull-request against a fixed type list that has
          # never included `brew`, so the formula PR this step opens has to be
          # retitled by hand before its Conventional title check can pass.
          # That check is not in the ruleset's required set (only `CI Passed`
          # is), so it never blocked the merge — this removes the rename, not a
          # blocker. Applies from v0.9.0 on: pr-title.yml arrived in #282
          # (2026-06-08) and every earlier formula PR predates it. #367 is the
          # instance that was renamed by hand.
          #
          # Note the real hold is elsewhere: this PR is created by
          # github-actions[bot], so its workflow runs land in `action_required`
          # and `CI Passed` never reports until someone approves them. On #364
          # that meant the title check never ran at all.
          git commit -m "chore(brew): update formula for v${VERSION}" || exit 0
          git push --force-with-lease origin "$BRANCH"
          gh pr create --title "chore(brew): update formula for v${VERSION}" --body "Auto-generated: updates Homebrew formula SHA for v${VERSION}" --base main || true

  # ── Verify the installer against the release it just made ────────────────
  #
  # The artifact was verified by packaging it; this verifies the script that
  # unpacks it, which is where every Windows install bug has actually lived.
  # Called rather than triggered by `release: published`: the release is created
  # with `secrets.GITHUB_TOKEN`, and GitHub does not start new workflow runs
  # from events created with that token, so the trigger never fired.
  #
  # Not a gate on the release — the assets are already published by the time it
  # runs — but a failure here lands on the run that produced them, which is the
  # difference between finding out now and finding out from a user.
  verify-install:
    needs: release
    if: ${{ !inputs.dry_run && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/windows-install.yml
    with:
      version: ${{ needs.release.outputs.version }}
