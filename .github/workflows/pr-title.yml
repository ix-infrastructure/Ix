name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            ci
            build
            perf
            chore
            revert
          # Jarvis (the agent that opens PRs) prefixes its titles with a status tag:
          # "[jarvis] ", "[jarvis][review-blocked] ", "[jarvis][blocked: <reason>] ", ...
          # The pattern below is the action's default conventional header pattern
          # with an optional leading "[jarvis]" tag (plus further [...] groups and
          # whitespace). Everything after the tag is judged exactly as before; other
          # bracket prefixes still fail. The tag only lives on the PR title: when a
          # Jarvis PR is squash-merged it may be dropped from (or carried into) the
          # commit title depending on merge settings, so check the squash title.
          headerPattern: '^(?:\[jarvis\](?:\[[^\]]*\])*\s+)?(\w*)(?:\((.*)\))?!?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
