name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast static gate ─────────────────────────────────────────────────────
  # Lint + typecheck + format need no native build, so this fails in ~1 min and
  # gives PR authors quick signal while the heavier matrix runs in parallel.
  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A raw NUL byte makes a file "binary" to grep/ripgrep, which then skips it
      # silently — including `ix text`, which shells out to rg. Two of the
      # largest sources in this repo carried them and were invisible to search.
      # Needs no toolchain, so it runs first and fails in seconds.
      - name: No raw NUL bytes in tracked sources
        # `shell: bash` for -o pipefail: without it the `tr | wc` pipeline below
        # reports wc's exit status, so a failed read would score as "0 NULs".
        shell: bash
        run: |
          status=0
          checked=0
          # -z / read -d '': a path containing a space would otherwise word-split,
          # the redirect would fail, and `wc -c` would still print 0 — passing the
          # file as clean. A guard against silent skipping must not skip silently.
          while IFS= read -r -d '' f; do
            checked=$((checked + 1))
            n=$(tr -dc '\000' < "$f" | wc -c)
            if [ "$n" -gt 0 ]; then
              echo "::error file=$f::$n raw NUL byte(s) — use the \\x00 escape instead; a raw NUL makes this file binary to grep/ripgrep, which silently skips it"
              status=1
            fi
          done < <(git ls-files -z '*.ts' '*.tsx' '*.mts' '*.cts' '*.js' '*.jsx' '*.mjs' '*.cjs')
          if [ "$checked" -eq 0 ]; then
            echo "::error::NUL-byte guard matched no files — the pathspecs or working directory are wrong, so this check is protecting nothing"
            exit 1
          fi
          echo "checked $checked tracked sources"
          exit $status
      # ── Workflow wiring ─────────────────────────────────────────────────
      #
      # In this job, not in actions-lint.yml beside zizmor, and that placement
      # is the point. The `main` ruleset requires exactly one status check,
      # `CI Passed`, whose `needs` this job is in; a check in any other workflow
      # reports and gates nothing. actions-lint.yml also carries
      # `paths: ['.github/workflows/**']`, so it is absent from most PRs and
      # could not be made required without hanging them.
      #
      # What it buys: release.yml calls windows-install.yml as a reusable
      # workflow, and nothing runs that call until a tag is pushed, so a
      # mistyped `uses:` path or a renamed input would surface for the first
      # time on a production release — the same blind spot as the
      # `release: published` trigger it replaces, which silently did nothing for
      # a whole release. actionlint resolves local `uses:` targets and matches
      # `with:` keys against the callee's declared inputs. It cannot see a
      # reusable-workflow permission restriction; that is an org setting no
      # linter reaches.
      #
      # shellcheck and pyflakes are off deliberately: actionlint shells out to
      # them for `run:` blocks when they are on PATH, which they are on
      # ubuntu-latest, so leaving them on makes a required check's verdict
      # depend on the runner image's shellcheck version rather than on the repo.
      #
      # Pinned by version and checksum, like every action here is pinned by SHA,
      # because this runs a downloaded binary. Dependabot's github-actions
      # ecosystem updates `uses:` refs and not `run:` downloads, so the bump is
      # manual — same as the `pipx install zizmor` next door, which pins nothing
      # at all.
      - name: Workflows are wired up (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Retried: this repo has already had a red check that was a release
          # asset download failing at the install step, reported as a workflow
          # problem it was not.
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  ${TARBALL}" | sha256sum --check --strict -
          tar -xzf "$TARBALL" actionlint
          ./actionlint -shellcheck= -pyflakes=
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ix-cli/package-lock.json
      - name: Install (ix-cli only — no native build needed)
        working-directory: ix-cli
        run: npm ci --silent
      - name: Lint
        working-directory: ix-cli
        run: npm run lint
      - name: Typecheck
        working-directory: ix-cli
        run: npm run typecheck
      - name: Dead-code check (knip)
        working-directory: ix-cli
        run: npm run knip
      # Prettier config + `npm run format` ship for local/editor use. A blocking
      # CI format gate is intentionally deferred: the legacy tree isn't formatted,
      # so enforcing on touched files would force full-file reformats and conflict
      # with in-flight branches. Adopt via a dedicated one-shot reformat later.

  # ── Cross-platform test matrix ───────────────────────────────────────────
  # Every OS the CLI ships to, on the release Node (22) plus the next major (24).
  # node-tree-sitter 0.25 compiles from source; node 24's V8 headers need C++20,
  # so the native flags are configured per-leg below.
  #
  # windows + node 24 is intentionally omitted: the tree-sitter grammars'
  # binding.gyp hard-codes /std:c++17, and unlike gcc/clang (where an appended
  # -std=c++20 wins) MSVC won't let an env flag override that, so the node-24
  # native compile fails on Windows. node 22 (the shipped runtime) covers all
  # three OSes; node 24 forward-compat is covered on Linux + macOS. Re-add when
  # the grammars stop pinning the C++ standard, or via an _CL_=/std:c++20 probe.
  test:
    name: Test (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22", coverage: true }
          - { os: ubuntu-latest, node: "24" }
          # Pinned to windows-2022: windows-latest now ships Visual Studio 18,
          # which the node-gyp bundled with node 22's npm cannot detect
          # ("unknown version") so the native tree-sitter compile fails. VS2022
          # is the toolchain node-gyp supports. Revisit when node-gyp ships
          # VS18 support (then windows-latest can return).
          - { os: windows-2022, node: "22" }
          - { os: macos-14, node: "22" }
          - { os: macos-14, node: "24" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: |
            ix-cli/package-lock.json
            core-ingestion/package-lock.json

      # Cache the compiled native tree-sitter grammars (the slow, flaky step).
      # Key includes OS + node + lockfile so a cache hit is binary-compatible;
      # build-core-ingestion.mjs then skips `npm ci` entirely on a hit.
      - name: Cache core-ingestion native deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core-ingestion/node_modules
          # v2: invalidate caches potentially poisoned by the failed VS18 runs
          # (runner.os is "Windows" for both windows-latest and windows-2022).
          key: core-ingestion-v2-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('core-ingestion/package-lock.json') }}

      - name: Configure native build flags (node 24)
        if: matrix.node == '24'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"
            echo "CXX=g++ -std=c++20" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"
          fi
          # Windows (MSVC) uses node-gyp defaults; revisit if the node-24 native
          # compile fails on the first run.

      - name: Install & build
        working-directory: ix-cli
        run: |
          npm ci --silent
          npm run build

      - name: Unit tests
        if: ${{ !matrix.coverage }}
        working-directory: ix-cli
        run: npm run test:unit

      - name: Unit tests + coverage
        if: ${{ matrix.coverage }}
        working-directory: ix-cli
        run: npm run test:coverage

      - name: Parser smoke test
        working-directory: ix-cli
        run: npm run smoke

      # core-ingestion has its own 358-test suite and nothing ran it until #557,
      # by which point 6 tests had been failing for months -- three of them since
      # #120 extracted the directory their fixtures lived in. The package is
      # already installed and built by the ix-cli build step above, so gating it
      # here costs one step rather than a whole job, and picks up the matrix's
      # OS/node spread for free (the tree-sitter grammars are native).
      - name: core-ingestion tests
        working-directory: core-ingestion
        run: npm test

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: ix-cli/coverage
          if-no-files-found: ignore

  # ── End-to-end against a real backend ────────────────────────────────────
  # Boots the published memory-layer + ArangoDB, then drives the built CLI
  # through the full write→read path: this is the class of bug (scoped reads,
  # schema drift) that unit tests can't reach.
  e2e:
    name: E2E (real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ix-cli/package-lock.json
            core-ingestion/package-lock.json
      - name: Cache core-ingestion native deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core-ingestion/node_modules
          key: core-ingestion-v2-${{ runner.os }}-node22-${{ hashFiles('core-ingestion/package-lock.json') }}

      - name: Build CLI
        working-directory: ix-cli
        run: |
          npm ci --silent
          npm run build

      - name: Start backend (memory-layer + ArangoDB)
        run: docker compose -f docker-compose.standalone.yml up -d --wait --wait-timeout 180

      - name: Smoke the full write→read path
        working-directory: ix-cli
        run: |
          set -euo pipefail
          # Absolute, because doctor is run from the mapped directory below.
          IX="node $PWD/dist/cli/main.js"
          FIXTURE="$PWD/test/fixtures/sample_project"
          echo "::group::status"; $IX status; echo "::endgroup::"
          echo "::group::map fixture"; $IX map "$FIXTURE" --silent; echo "::endgroup::"
          echo "::group::search"; $IX search BillingService --format json | tee search.json; echo "::endgroup::"
          node -e "const r=require('./search.json');const n=(r.results||r).length||0;if(!n){console.error('no search results after map');process.exit(1)}console.log('search returned',n,'results')"
          # From the directory the fixture was mapped into. doctor answers for
          # its own cwd (#518), and `ix-cli` is not a registered workspace — a
          # healthy result there would mean doctor was quoting some other graph.
          echo "::group::doctor"; (cd "$FIXTURE" && $IX doctor --format json) | tee doctor.json; echo "::endgroup::"
          node -e "const d=require('./doctor.json');if(!d.healthy){console.error('doctor not healthy');process.exit(1)}"
          # The converse, and the regression guard for #518: in a directory no
          # workspace covers, doctor must say so instead of passing every check
          # against whichever workspace happens to be the default.
          echo "::group::doctor (unmapped cwd)"
          set +e
          (cd "$RUNNER_TEMP" && $IX doctor --format json) | tee doctor-unmapped.json
          doctor_exit=${PIPESTATUS[0]}
          set -e
          if [ "$doctor_exit" -ne 1 ]; then echo "expected doctor to exit 1 for an unmapped cwd, got $doctor_exit"; exit 1; fi
          echo "::endgroup::"
          node -e "const d=require('./doctor-unmapped.json');const c=(d.checks||[]).find(c=>c.name==='Workspace for this directory');if(!c){console.error('no workspace check in doctor output');process.exit(1)}if(c.ok||d.healthy){console.error('doctor reported healthy in a directory with no workspace');process.exit(1)}console.log('unmapped cwd reported:',c.detail)"

      - name: Backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.standalone.yml logs --tail 200

  # ── API-reference parity gate ────────────────────────────────────────────
  # docs/api/openapi.yaml claims to be generated from the client source; this
  # gate enforces it across four surfaces: endpoint parity (client calls vs
  # openapi paths), openapi.yaml validity + $ref integrity, the schema contract
  # (every schema must exist in types.ts or the explicit allowlist), and the
  # README Endpoints by Area section. A client call pattern the gate cannot
  # classify fails loudly rather than passing silently. The gate parses yaml
  # with the `yaml` package, so ix-cli deps are installed first.
  api-parity:
    name: API-reference parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ix-cli/package-lock.json
      - name: Install (ix-cli)
        working-directory: ix-cli
        run: npm ci --silent
      - name: docs/api vs client surface
        working-directory: ix-cli
        run: node scripts/check-api-parity.mjs

  # ── Harness installer smoke ─────────────────────────────────────────────
  # Keep this in a clean container and feed both surfaces the same tiny fixture.
  # The real machine's PATH and home directory must not decide this test: if the
  # fixture disappears or the helper stops consuming toolscan output, the
  # positive/negative assertions below fail instead of silently passing.
  #
  # The fake claude lives at $HOME/.local/bin — deliberately NOT on PATH — and
  # only the fake toolscan knows it, so this job exercises the seam's motivating
  # case: presence decided by toolscan, and the off-PATH CLI invoked through
  # the absolute path toolscan reported. If that threading regressed, inspect
  # would ENOENT and the CLI would report a false conflict instead of
  # would-register.
  harness-install-smoke:
    name: Harness install smoke
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ix CLI dependencies
        working-directory: ix-cli
        run: npm ci --silent
      - name: Build Ix CLI
        working-directory: ix-cli
        run: npm run build
      - name: Exercise the skills table and shell installer
        shell: bash
        env:
          HOME: /tmp/ix-harness-home
          HARNESS_HOME: /tmp/ix-harness-home
        run: |
          set -euo pipefail
          # This job runs in a container, where the github.workspace context
          # resolves to the HOST path (/home/runner/work/...) that does not
          # exist inside the container. Resolve fixtures against the step cwd
          # (the checkout root) so the path is right on host and container.
          FIXTURE="$PWD/.github/fixtures/harness-smoke"
          test -f "$FIXTURE/claude" || { echo "fixture missing: $FIXTURE"; ls -la .github/fixtures/harness-smoke/ || true; exit 1; }
          rm -rf "$HOME"
          mkdir -p "$HOME/.local/bin"
          # Installed off PATH, exactly where toolscan's extra roots matter.
          cp "$FIXTURE/claude" "$HOME/.local/bin/claude"
          chmod +x "$HOME/.local/bin/claude"
          export TOOLSCAN_PATH="$FIXTURE/toolscan.mjs"

          rows=$(node ix-cli/scripts/skill-harnesses.mjs --probe)
          printf '%s\n' "$rows"
          grep -Fq 'claude|Claude Code|claude|~/.claude|~/.claude/skills|1|toolscan' <<<"$rows"
          grep -Fq 'codex|Codex CLI|codex|~/.codex|~/.codex/skills|0|none' <<<"$rows"
          grep -Fq 'agents|Agents (agents.md)||~/.agents|~/.agents/skills|0|none' <<<"$rows"
          grep -Fq 'cursor|Cursor|cursor|~/.cursor|~/.cursor/skills-cursor|0|none' <<<"$rows"
          # Harnesses without a skills convention must not be install targets.
          ! grep -Fq 'openclaw' <<<"$rows"
          ! grep -Fq 'gemini' <<<"$rows"

          install_out=$(bash scripts/install-skill.sh --dry-run)
          printf '%s\n' "$install_out"
          grep -Fq 'would install: /tmp/ix-harness-home/.claude/skills/ix' <<<"$install_out"
          test ! -e "$HOME/.claude/skills/ix"

          shell_json=$(bash scripts/install-skill.sh --dry-run --json)
          printf '%s\n' "$shell_json"
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const byId = new Map(r.hosts.map((h) => [h.id, h]));
            const claude = byId.get("claude");
            if (claude?.action !== "would-install") throw new Error("claude not would-install in shell report");
            if (claude?.detectedVia !== "toolscan") throw new Error("claude detection source not toolscan in shell report");
            if (!claude?.dest.endsWith("/.claude/skills/ix")) throw new Error("claude dest wrong: " + claude?.dest);
            for (const id of ["codex", "agents", "cursor"]) {
              const h = byId.get(id);
              if (h?.action !== "skip") throw new Error(id + " not skipped in shell report");
              if (h?.detectedVia !== "none") throw new Error(id + " detection source not none in shell report");
            }
          ' <<<"$shell_json"
      - name: Exercise ix mcp install dry-run against the off-PATH fixture
        shell: bash
        env:
          HOME: /tmp/ix-harness-home
        working-directory: ix-cli
        run: |
          set -euo pipefail
          # Same container-path rationale as the step above: derive the fixture
          # from the step cwd (this step runs in ix-cli) instead of the
          # host-resolved github.workspace context.
          FIXTURE="$(cd .. && pwd)/.github/fixtures/harness-smoke"
          export TOOLSCAN_PATH="$FIXTURE/toolscan.mjs"
          test -f "$TOOLSCAN_PATH" || { echo "toolscan fixture missing: $TOOLSCAN_PATH"; exit 1; }
          # --host restricts the registry the same way the old env fixture did;
          # an unknown id fails loudly, so a renamed host cannot pass silently.
          node dist/cli/main.js mcp install --host claude codex openclaw --dry-run --format json | tee /tmp/mcp-install.json
          node -e '
            const r = require("/tmp/mcp-install.json");
            const byId = new Map(r.hosts.map((h) => [h.id, h]));
            // claude is NOT on PATH here — only the fake toolscan names it, and
            // inspect must run the absolute path toolscan reported. A would-
            // register proves the threading; a conflict would mean the seam
            // regressed to PATH-only execution.
            if (byId.get("claude")?.outcome !== "would-register")
              throw new Error("claude was not detected: " + JSON.stringify(byId.get("claude")));
            if (byId.get("claude")?.detectedVia !== "toolscan")
              throw new Error("claude was not detected via toolscan: " + byId.get("claude")?.detectedVia);
            if (byId.get("codex")?.outcome !== "not-installed") throw new Error("codex was detected unexpectedly");
            if (byId.get("codex")?.detectedVia !== "none") throw new Error("codex detection source not reported");
            if (byId.get("openclaw")?.outcome !== "not-installed") throw new Error("openclaw was detected unexpectedly");
            if (byId.get("openclaw")?.detectedVia !== "none") throw new Error("openclaw detection source not reported");
          '

  # Windows twin of the harness smoke: the Linux job runs in a clean container,
  # but the Windows branches of this surface — the `where` probe, the cmd-shim
  # execution path (hosts.ts run/quoteForCmd), and install-skill.sh under Git
  # Bash — are never executed there. This leg runs the same two batteries on a
  # real windows-2022 runner. The fake claude is the .cmd twin (shebang scripts
  # cannot be spawned by CreateProcess) and toolscan.mjs reports the platform
  # twin's path; everything else is byte-for-byte the Linux assertions. No
  # container (Linux-only), no mktemp: the hermetic HOME derives from
  # runner.temp, the platform temp API.
  harness-install-smoke-windows:
    name: Harness install smoke (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ix-cli/package-lock.json
      - name: Install Ix CLI dependencies
        working-directory: ix-cli
        run: npm ci --silent
      - name: Build Ix CLI
        working-directory: ix-cli
        run: npm run build
      - name: Exercise the skills table and shell installer (Git Bash)
        shell: bash
        env:
          HOME: ${{ runner.temp }}/ix-harness-home
          HARNESS_HOME: ${{ runner.temp }}/ix-harness-home
        run: |
          set -euo pipefail
          FIXTURE="$PWD/.github/fixtures/harness-smoke"
          test -f "$FIXTURE/claude.cmd" || { echo "fixture missing: $FIXTURE"; ls -la .github/fixtures/harness-smoke/ || true; exit 1; }
          rm -rf "$HOME"
          mkdir -p "$HOME/.local/bin"
          # Installed off PATH, exactly where toolscan's extra roots matter.
          cp "$FIXTURE/claude.cmd" "$HOME/.local/bin/claude.cmd"
          export TOOLSCAN_PATH="$FIXTURE/toolscan.mjs"

          rows=$(node ix-cli/scripts/skill-harnesses.mjs --probe)
          printf '%s\n' "$rows"
          grep -Fq 'claude|Claude Code|claude|~/.claude|~/.claude/skills|1|toolscan' <<<"$rows"
          grep -Fq 'codex|Codex CLI|codex|~/.codex|~/.codex/skills|0|none' <<<"$rows"
          grep -Fq 'agents|Agents (agents.md)||~/.agents|~/.agents/skills|0|none' <<<"$rows"
          grep -Fq 'cursor|Cursor|cursor|~/.cursor|~/.cursor/skills-cursor|0|none' <<<"$rows"
          # Harnesses without a skills convention must not be install targets.
          ! grep -Fq 'openclaw' <<<"$rows"
          ! grep -Fq 'gemini' <<<"$rows"

          install_out=$(bash scripts/install-skill.sh --dry-run)
          printf '%s\n' "$install_out"
          dest="$HOME/.claude/skills/ix"
          grep -Fq "would install: $dest" <<<"$install_out"
          test ! -e "$dest"

          shell_json=$(bash scripts/install-skill.sh --dry-run --json)
          printf '%s\n' "$shell_json"
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const byId = new Map(r.hosts.map((h) => [h.id, h]));
            const claude = byId.get("claude");
            if (claude?.action !== "would-install") throw new Error("claude not would-install in shell report");
            if (claude?.detectedVia !== "toolscan") throw new Error("claude detection source not toolscan in shell report");
            if (!claude?.dest.endsWith("/.claude/skills/ix")) throw new Error("claude dest wrong: " + claude?.dest);
            for (const id of ["codex", "agents", "cursor"]) {
              const h = byId.get(id);
              if (h?.action !== "skip") throw new Error(id + " not skipped in shell report");
              if (h?.detectedVia !== "none") throw new Error(id + " detection source not none in shell report");
            }
          ' <<<"$shell_json"
      - name: Exercise ix mcp install dry-run against the off-PATH fixture (Git Bash)
        shell: bash
        env:
          HOME: ${{ runner.temp }}/ix-harness-home
        working-directory: ix-cli
        run: |
          set -euo pipefail
          FIXTURE="$(cd .. && pwd)/.github/fixtures/harness-smoke"
          export TOOLSCAN_PATH="$FIXTURE/toolscan.mjs"
          test -f "$TOOLSCAN_PATH" || { echo "toolscan fixture missing: $TOOLSCAN_PATH"; exit 1; }
          # --host restricts the registry the same way the old env fixture did;
          # an unknown id fails loudly, so a renamed host cannot pass silently.
          node dist/cli/main.js mcp install --host claude codex openclaw --dry-run --format json | tee "$HOME/mcp-install.json"
          MCP_INSTALL_JSON="$HOME/mcp-install.json" node -e '
            const r = require(process.env.MCP_INSTALL_JSON);
            const byId = new Map(r.hosts.map((h) => [h.id, h]));
            // claude is NOT on PATH here — only the fake toolscan names it, and
            // inspect must run the absolute path toolscan reported through the
            // cmd shim. A would-register proves the threading; a conflict would
            // mean the seam regressed to PATH-only execution.
            if (byId.get("claude")?.outcome !== "would-register")
              throw new Error("claude was not detected: " + JSON.stringify(byId.get("claude")));
            if (byId.get("claude")?.detectedVia !== "toolscan")
              throw new Error("claude was not detected via toolscan: " + byId.get("claude")?.detectedVia);
            if (byId.get("codex")?.outcome !== "not-installed") throw new Error("codex was detected unexpectedly");
            if (byId.get("codex")?.detectedVia !== "none") throw new Error("codex detection source not reported");
            if (byId.get("openclaw")?.outcome !== "not-installed") throw new Error("openclaw was detected unexpectedly");
            if (byId.get("openclaw")?.detectedVia !== "none") throw new Error("openclaw detection source not reported");
          '

  # ── Aggregate gate ───────────────────────────────────────────────────────
  # ── Link gate ────────────────────────────────────────────────────────────
  # Probes every external URL in the repo's markdown and fails on 404/410, so
  # a link that stops resolving cannot merge. Zero dependencies (Node fetch),
  # so no npm ci — runs in seconds. The allowlist is self-cleaning: an entry
  # that no longer appears in any scanned file fails the gate, so an allowed
  # dead link forces its own removal once the fixing PR merges.
  links:
    name: Dead-link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Check markdown links
        run: node ix-cli/scripts/check-links.mjs

  # One stable required-status-check context. Branch protection requires only
  # this job, so the matrix can be reshaped without orphaning required checks.
  # Fails if any upstream job failed OR was skipped/cancelled.
  # ── Flag-reference parity gate (#576) ───────────────────────────────────
  # The flag reference (skills/ix/references/flags.md, #578) must stay in step
  # with the *registered* commander tree: a registered flag without a doc row,
  # or a doc row for a flag the CLI no longer registers, fails this job with
  # the flag named. It reads the built CLI (dist/), never a regex over source —
  # the same surface dump-cli-surface.mjs inventories. Inactive (green) while
  # flags.md is absent, so it activates exactly when the reference ships and is
  # strict from then on.
  doc-parity:
    name: Flag-reference parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ix-cli/package-lock.json
      - name: Install (ix-cli)
        working-directory: ix-cli
        run: npm ci --silent
      - name: Build (the gate reads dist/, what ships)
        working-directory: ix-cli
        run: npm run build
      - name: Registered flags vs flag reference
        working-directory: ix-cli
        run: node scripts/check-doc-parity.mjs

  ci-success:
    name: CI Passed
    if: always()
    needs: [static, test, e2e, api-parity, doc-parity, links, harness-install-smoke, harness-install-smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "static=${{ needs.static.result }}"
          echo "test=${{ needs.test.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "api-parity=${{ needs.api-parity.result }}"
          echo "doc-parity=${{ needs.doc-parity.result }}"
          echo "links=${{ needs.links.result }}"
          echo "harness-install-smoke=${{ needs.harness-install-smoke.result }}"
          echo "harness-install-smoke-windows=${{ needs.harness-install-smoke-windows.result }}"
          [ "${{ needs.static.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.e2e.result }}" = "success" ] \
            && [ "${{ needs.api-parity.result }}" = "success" ] \
            && [ "${{ needs.doc-parity.result }}" = "success" ] \
            && [ "${{ needs.links.result }}" = "success" ] \
            && [ "${{ needs.harness-install-smoke.result }}" = "success" ] \
            && [ "${{ needs.harness-install-smoke-windows.result }}" = "success" ]
