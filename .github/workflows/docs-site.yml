name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'skills/ix/references/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'skills/ix/references/**'
      - '.github/workflows/docs-site.yml'

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site renders docs/llm-format.md, docs/api/ and skills/ix/references/flags.md
  # at build time, so a change to any of them can break it without touching docs-site/.
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
