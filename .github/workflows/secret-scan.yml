name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history
          persist-credentials: false
      # The gitleaks GitHub Action requires a paid license for org accounts, but
      # the gitleaks binary itself is free (MIT). Run it directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # Pinned by version and checksum because this runs a downloaded binary.
        # Dependabot does not bump `run:` downloads, so the version and checksum
        # are updated by hand (checksums are in the release's
        # gitleaks_<version>_checksums.txt).
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum --check --strict -
          tar -xzf "$TARBALL" gitleaks
          ./gitleaks version
      - name: Scan repository
        # `git` scans the commit history that fetch-depth: 0 checked out;
        # `dir` would only scan the working tree.
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose --exit-code 1
