openapi: 3.0.0
info:
  title: Ix Backend API
  description: |
    JSON-over-HTTP API for the Ix persistent codebase graph. Served by the
    local backend at http://localhost:8090 (Docker memory-layer). The `ix` CLI
    and Compass visualizer are the primary clients. Local deployments have no
    authentication; remote deployments may gate Pro features (see
    /v1/capabilities). Scoping is via `workspace_id` / `system_id` query/body
    params, or the `x-ix-workspace` / `x-ix-system` headers stamped by the
    visualizer proxy.
  version: "1.0.0"
  contact:
    name: Ix
    url: https://github.com/ix-infrastructure/Ix
servers:
  - url: http://localhost:8090
    description: Local backend (Docker memory-layer)
  - url: http://localhost:8080
    description: Compass visualizer (proxies /v1 to the backend)
tags:
  - name: health
  - name: context
  - name: ingestion
  - name: search
  - name: entities
  - name: planning
    description: >-
      Goals, truth statements and decisions. The OSS backend serves these
      endpoints, but the ix commands that read and write them (goal, truth,
      decide, decisions and the rest) are part of Ix Pro.
  - name: patches
  - name: analysis
  - name: stats
  - name: notes
    description: >-
      Notes and sessions in the memory layer, read and written by `ix note`
      and `ix session`. Served by the OSS backend; with Ix Pro installed the
      same commands go to the active cloud org instead.
  - name: reset

paths:
  /v1/health:
    get:
      tags: [health]
      summary: Liveness probe and graph schema version
      operationId: getHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The backend is up but cannot reach its database (status degraded, database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/capabilities:
    get:
      tags: [health]
      summary: Feature detection (Pro flags)
      operationId: getCapabilities
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /v1/context:
    post:
      tags: [context]
      summary: Structured-context question answering
      operationId: queryContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                asOfRev: { type: integer, description: Read the graph as of this revision }
                depth: { type: string, description: Traversal depth hint }
      responses:
        "200":
          description: Structured context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredContext"

  /v1/map:
    post:
      tags: [ingestion]
      summary: Full code map (systems → subsystems → members)
      operationId: getMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full: { type: boolean, default: false }
                workspace_id: { type: string }
                system_id: { type: string }
      responses:
        "200":
          description: Code map
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_count: { type: integer }
                  region_count: { type: integer }
                  levels: { type: integer }
                  map_rev: { type: integer }
                  outcome: { type: string }
                  regions: { type: array, items: { type: object } }
                  edges: { type: array, items: { type: object } }
                  hierarchy: { type: array, items: { type: object } }

  /v1/source-hashes:
    post:
      tags: [ingestion]
      summary: Workspace-scoped source-hash baseline lookup
      operationId: getSourceHashes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uris]
              properties:
                uris: { type: array, items: { type: string }, description: Workspace-relative paths }
                workspaceIds: { type: array, items: { type: string } }
      responses:
        "200":
          description: One row per (workspace_id, uri)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    workspaceId:
                      type: string
                      nullable: true
                    uri: { type: string }
                    hash: { type: string }

  /v1/source-hashes/exists:
    get:
      tags: [ingestion]
      summary: Whether an ingest baseline exists
      operationId: hasIngestBaseline
      responses:
        "200":
          description: Baseline existence
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists: { type: boolean }

  /v1/stitch:
    post:
      tags: [ingestion]
      summary: Cross-repo stitching (register provides/consumes, join edges)
      operationId: stitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, provides, consumes]
              properties:
                workspaceId: { type: string }
                provides:
                  type: array
                  items:
                    type: object
                    required: [name, entryNodeId]
                    properties:
                      name: { type: string }
                      entryNodeId: { type: string }
                      entryUri: { type: string }
                consumes:
                  type: array
                  items:
                    type: object
                    required: [name, consumerNodeId]
                    properties:
                      name: { type: string }
                      consumerNodeId: { type: string }
                exports:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      nodeId: { type: string }
                symbolConsumes:
                  type: array
                  items:
                    type: object
                    properties:
                      symbol: { type: string }
                      callerNodeId: { type: string }
                      pkg: { type: string }
      responses:
        "200":
          description: Stitch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  stitched: { type: integer }
                  systemId:
                    type: string
                    nullable: true
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        src: { type: string }
                        dst: { type: string }
                        name: { type: string }

  /v1/stitch/system/{workspaceId}:
    get:
      tags: [ingestion]
      summary: System id a workspace belongs to (null for singleton)
      operationId: workspaceSystem
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: System membership
          content:
            application/json:
              schema:
                type: object
                properties:
                  systemId:
                    type: string
                    nullable: true

  /v1/search:
    post:
      tags: [search]
      summary: Search nodes by term
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term]
              properties:
                term: { type: string }
                limit: { type: integer }
                kind: { type: string }
                language: { type: string }
                asOfRev: { type: integer }
                nameOnly: { type: boolean }
                workspaceId: { type: string }
                systemId: { type: string }
      responses:
        "200":
          description: Matching nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GraphNode"

  /v1/search/semantic:
    post:
      tags: [search]
      summary: Vector-similarity search (ordered by similarity; do not re-rank)
      operationId: semanticSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term]
              properties:
                term: { type: string }
                limit: { type: integer }
                kind: { type: string }
                workspaceId: { type: string }
                systemId: { type: string }
      responses:
        "200":
          description: Nodes ordered by similarity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GraphNode"
        "503":
          description: Extraction service not configured

  /v1/list:
    post:
      tags: [search]
      summary: List entities by kind
      operationId: listByKind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string }
                limit: { type: integer }
                scope: { type: string }
                workspaceId: { type: string }
                systemId: { type: string }
      responses:
        "200":
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GraphNode"

  /v1/entity/{id}:
    get:
      tags: [entities]
      summary: Fetch a node with claims and edges
      operationId: getEntity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/GraphNode" }
                  claims: { type: array, items: { type: object } }
                  edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }

  /v1/nodes:
    post:
      tags: [entities]
      summary: Fetch many live nodes in one read (Ix-memory 1.0.33+)
      operationId: getNodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string }, maxItems: 1000, description: Node ids (UUIDs) }
                fields: { type: string, enum: [full], description: "full returns whole nodes, attrs and provenance included" }
      responses:
        "200":
          description: The live nodes, and the ids that are not live
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev: { type: integer }
                  nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
                  missing: { type: array, items: { type: string } }
        "413":
          description: More than 1000 ids

  /v1/resolve-prefix/{prefix}:
    get:
      tags: [entities]
      summary: Resolve a shortened id prefix
      operationId: resolvePrefix
      parameters:
        - name: prefix
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved id or ambiguity error
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  error: { type: string, enum: [ambiguous] }
                  matches: { type: array, items: { type: string } }

  /v1/expand:
    post:
      tags: [entities]
      summary: Expand a node's neighborhood
      operationId: expand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId]
              properties:
                nodeId: { type: string }
                direction: { type: string, default: both }
                predicates: { type: array, items: { type: string } }
                hops: { type: integer, default: 1 }
      responses:
        "200":
          description: Neighborhood
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
                  edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }

  /v1/degree:
    post:
      tags: [entities]
      summary: One-hop neighbour counts for many nodes
      operationId: degree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, direction]
              properties:
                ids: { type: array, maxItems: 5000, items: { type: string } }
                direction: { type: string }
                predicates: { type: array, items: { type: string } }
                distinct: { type: boolean }
                branchId: { type: string }
      responses:
        "200":
          description: Counts per requested id
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev: { type: integer }
                  counts: { type: object, additionalProperties: { type: integer } }
                  truncated: { type: boolean }

  /v1/expand-by-name:
    post:
      tags: [entities]
      summary: Expand by entity name
      operationId: expandByName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                direction: { type: string, default: both }
                predicates: { type: array, items: { type: string } }
                kinds: { type: array, items: { type: string } }
      responses:
        "200":
          description: Neighborhood
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
                  edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }

  /v1/truth:
    get:
      tags: [planning]
      summary: List planning artifacts (goals, truth statements)
      operationId: listTruth
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GraphNode"
    post:
      tags: [planning]
      summary: Create a goal/truth statement
      operationId: createTruth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                statement: { type: string }
                parentIntent: { type: string }
      responses:
        "200":
          description: Created artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeCreationResult"

  /v1/decide:
    post:
      tags: [planning]
      summary: Record a decision
      operationId: decide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, rationale]
              properties:
                title: { type: string }
                rationale: { type: string }
                intentId: { type: string }
      responses:
        "200":
          description: Created decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeCreationResult"

  /v1/decisions:
    post:
      tags: [planning]
      summary: List decisions
      operationId: listDecisions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer }
                topic: { type: string }
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GraphNode"

  /v1/patches:
    get:
      tags: [patches]
      summary: List patches
      operationId: listPatches
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Patch summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatchSummary"

  /v1/patches/{id}:
    get:
      tags: [patches]
      summary: Fetch a single patch
      operationId: getPatch
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Patch

  /v1/revisions/current:
    get:
      tags: [patches]
      summary: Head revision of the graph
      description: >-
        The revision record of the latest commit, or the bare revision number
        when the backend holds no record for it. Every committed patch in any
        workspace advances it.
      operationId: currentRevision
      responses:
        "200":
          description: Head revision
          content:
            application/json:
              schema:
                oneOf:
                  - type: integer
                  - type: object
                    properties:
                      rev: { type: integer }
                      patchId: { type: string }
                      timestamp: { type: string }

  /v1/patch:
    post:
      tags: [patches]
      summary: Commit a single patch (5 min client timeout)
      operationId: commitPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphPatchPayload"
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchCommitResult"

  /v1/patches/batch:
    post:
      tags: [patches]
      summary: Commit an array of patches (unwrapped body)
      operationId: commitPatchBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GraphPatchPayload"
      responses:
        "200":
          description: Commit results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatchCommitResult"

  /v1/patches/bulk:
    post:
      tags: [patches]
      summary: "Commit patches wrapped as { patches: [...] } (5 min client timeout)"
      operationId: commitPatchBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patches]
              properties:
                patches:
                  type: array
                  items:
                    $ref: "#/components/schemas/GraphPatchPayload"
      responses:
        "200":
          description: Commit results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatchCommitResult"

  /v1/provenance/{entityId}:
    post:
      tags: [patches]
      summary: Provenance for an entity
      operationId: provenance
      parameters:
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provenance

  /v1/diff:
    post:
      tags: [analysis]
      summary: Diff between graph revisions
      operationId: diff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromRev, toRev]
              properties:
                fromRev: { type: integer }
                toRev: { type: integer }
                entityId: { type: string }
                summary: { type: boolean }
                limit: { type: integer }
      responses:
        "200":
          description: Diff

  /v1/conflicts:
    get:
      tags: [analysis]
      summary: List detected conflicts
      operationId: conflicts
      responses:
        "200":
          description: Conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /v1/smells:
    get:
      tags: [analysis]
      summary: List computed smells
      operationId: listSmells
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: system_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Smells
    post:
      tags: [analysis]
      summary: Run smell analysis
      operationId: runSmells
      parameters:
        - name: orphan-max-connections
          in: query
          schema: { type: integer }
        - name: god-module-chunks
          in: query
          schema: { type: integer }
        - name: god-module-fan
          in: query
          schema: { type: integer }
        - name: weak-max-neighbors
          in: query
          schema: { type: integer }
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: system_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Smell analysis result

  /v1/subsystems:
    get:
      tags: [analysis]
      summary: List subsystems
      operationId: listSubsystems
      parameters:
        - name: detailed
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
        - name: regions
          in: query
          schema: { type: string }
        - name: edge_cap
          in: query
          schema: { type: integer }
        - name: member_file_cap
          in: query
          schema: { type: integer }
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: system_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Subsystems

  /v1/subsystems/score:
    post:
      tags: [analysis]
      summary: Score subsystems
      operationId: scoreSubsystems
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: system_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Scores

  /v1/subsystems/map:
    get:
      tags: [analysis]
      summary: Subsystem map for the visualizer
      operationId: getSubsystemMap
      parameters:
        - name: target
          in: query
          schema: { type: string }
        - name: pick
          in: query
          schema: { type: integer, description: 1-based candidate for ambiguous targets }
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: system_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Subsystem map

  /v1/stats:
    get:
      tags: [stats]
      summary: Graph statistics
      operationId: stats
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: system_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Node/edge totals by kind
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: object
                    properties:
                      total: { type: integer }
                      byKind:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string }
                            count: { type: integer }
                  edges:
                    type: object
                    properties:
                      total: { type: integer }
                      byKind:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string }
                            count: { type: integer }

  /v1/savings:
    get:
      tags: [stats]
      summary: Token-savings metrics
      operationId: savings
      parameters:
        - name: detail
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Savings metrics
    delete:
      tags: [stats]
      summary: Reset savings metrics
      operationId: savingsReset
      responses:
        "200":
          description: Reset confirmation

  /v1/note:
    post:
      tags: [notes]
      summary: Create a note
      operationId: createNote
      description: >-
        `sessionId` may be a session name; the backend resolves it to the id.
        `tag` defaults to `note`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "200":
          description: The created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /v1/note/{id}:
    get:
      tags: [notes]
      summary: Fetch one note
      operationId: getNote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The note, with its session and lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSearchResult"
        "404":
          description: "No such note: `{ error: not_found, message }`"

  /v1/note/{id}/supersede:
    post:
      tags: [notes]
      summary: Replace a note, linking the new one to it
      operationId: supersedeNote
      description: >-
        Not idempotent: every call creates a new note. Only the note's author
        (or an org admin) may supersede it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "200":
          description: The old note's id and the new note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupersedeNoteResult"

  /v1/note/{id}/retract:
    post:
      tags: [notes]
      summary: Soft-delete a note
      operationId: retractNote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string }
      responses:
        "200":
          description: Retraction confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetractNoteResult"

  /v1/notes:
    get:
      tags: [notes]
      summary: List or search notes
      operationId: listNotes
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, description: ISO timestamp } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: includeSuperseded, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Matching notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteSearchResult"

  /v1/session:
    post:
      tags: [notes]
      summary: Create a session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: The created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"

  /v1/session/{nameOrId}:
    get:
      tags: [notes]
      summary: Fetch a session by name, then by id
      operationId: getSession
      parameters:
        - name: nameOrId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "404":
          description: "No such session: `{ error: not_found, message }`"
    delete:
      tags: [notes]
      summary: Delete a session's metadata (its notes are kept)
      operationId: deleteSession
      parameters:
        - name: nameOrId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResult"

  /v1/session/{nameOrId}/join:
    post:
      tags: [notes]
      summary: Add an actor to a session
      operationId: joinSession
      parameters:
        - name: nameOrId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor: { type: string }
      responses:
        "200":
          description: The session, with the actor added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"

  /v1/session/{nameOrId}/pin:
    post:
      tags: [notes]
      summary: Pin graph nodes to a session
      operationId: pinSessionNodes
      parameters:
        - name: nameOrId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeIds]
              properties:
                nodeIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: How many nodes were pinned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinSessionResult"

  /v1/session/{nameOrId}/notes:
    get:
      tags: [notes]
      summary: A session's notes
      operationId: sessionNotes
      parameters:
        - name: nameOrId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session's notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"

  /v1/sessions:
    get:
      tags: [notes]
      summary: List sessions
      operationId: listSessions
      parameters:
        - { name: actor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"

  /v1/reset:
    post:
      tags: [reset]
      summary: Wipe ALL nodes and edges (global — no workspace scoping)
      operationId: reset
      responses:
        "200":
          description: Reset confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"

  /v1/reset/async:
    post:
      tags: [reset]
      summary: Begin an async wipe (remote deployments)
      operationId: resetAsync
      responses:
        "202":
          description: Operation handle
          content:
            application/json:
              schema:
                type: object
                required: [opId]
                properties:
                  # `format: uuid` alone admits uppercase hex. The backend emits
                  # UUID.randomUUID().toString(), which is lowercase, and the
                  # client validates this handle before polling.
                  opId:
                    type: string
                    format: uuid
                    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        "404":
          description: |
            Route not present on this deployment (older backend). The client
            falls back to the synchronous reset path on this status only.

  /v1/reset/status/{opId}:
    get:
      tags: [reset]
      summary: Poll an async reset operation
      operationId: resetStatus
      parameters:
        - name: opId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                type: object
                required: [opId, state]
                properties:
                  opId:
                    type: string
                    format: uuid
                    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                  state: { type: string, enum: [done, failed, running] }
                  error:
                    type: string
                    nullable: true
        "404":
          description: |
            No ledger entry for this operation. The ledger is in-process and
            bounded, so a restart, a different replica or eviction produces
            this for an operation that may have completed. It is NOT proof the
            reset did not run.

  /v1/reset/code:
    post:
      tags: [reset]
      summary: Wipe only the code graph (preserves planning artifacts)
      operationId: resetCode
      responses:
        "200":
          description: Reset confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"

  /v1/reset/code/async:
    post:
      tags: [reset]
      summary: Begin an async code-graph wipe
      operationId: resetCodeAsync
      responses:
        "200":
          description: Operation handle
          content:
            application/json:
              schema:
                type: object
                properties:
                  opId: { type: string }

  /v1/reset/workspace:
    post:
      tags: [reset]
      summary: Wipe exactly one workspace (other workspaces untouched)
      operationId: deleteWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string }
      responses:
        "200":
          description: Workspace wiped

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string }
        schema_version: { type: integer, description: On-disk graph format version }
        release_version: { type: string, description: Backend release semver }
        database:
          type: string
          enum: [reachable, unreachable]
          description: Whether the backend can reach its database (1.0.33+). Absent on older backends
    CapabilitiesResponse:
      type: object
      properties:
        proFeaturesEnabled:
          type: boolean
          description: Absent = unknown (older backends), not false
    GraphNode:
      type: object
      required: [id, kind, name, attrs, provenance, createdRev, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        attrs: { type: object, additionalProperties: true }
        provenance:
          type: object
          properties:
            sourceUri: { type: string, description: Workspace-relative path }
            sourceHash: { type: string }
            extractor: { type: string }
            sourceType: { type: string }
            observedAt: { type: string, format: date-time }
        createdRev: { type: integer }
        deletedRev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GraphEdge:
      type: object
      required: [id, src, dst, predicate, attrs, createdRev]
      properties:
        id: { type: string }
        src: { type: string }
        dst: { type: string }
        predicate: { type: string, description: calls | imports | contains | … }
        attrs: { type: object, additionalProperties: true }
        createdRev: { type: integer }
        deletedRev: { type: integer }
    Factor:
      type: object
      required: [value, reason]
      properties:
        value: { type: number }
        reason: { type: string }
    ConfidenceBreakdown:
      type: object
      description: >-
        The factors behind a claim's confidence. The combined confidence is the
        product of the six factor values, clamped to [0, 1]; it is not
        serialized in this object (compactClaims[].confidence.score carries
        it). ScoredClaim.finalScore is relevance × confidence, not confidence.
      required: [baseAuthority, verification, recency, corroboration, conflictPenalty, intentAlignment]
      properties:
        baseAuthority: { $ref: "#/components/schemas/Factor" }
        verification: { $ref: "#/components/schemas/Factor" }
        recency: { $ref: "#/components/schemas/Factor" }
        corroboration: { $ref: "#/components/schemas/Factor" }
        conflictPenalty: { $ref: "#/components/schemas/Factor" }
        intentAlignment: { $ref: "#/components/schemas/Factor" }
    Claim:
      type: object
      required: [id, entityId, statement, status]
      properties:
        id: { type: string }
        entityId: { type: string }
        statement: { type: string }
        status:
          type: string
          enum: [Active, Stale, Retracted]
        value:
          description: The claimed value (any JSON value)
        confidence:
          description: Confidence stored on the claim itself; the scored breakdown is ScoredClaim.confidence
        provenance:
          type: object
          properties:
            sourceUri: { type: string, description: Workspace-relative path }
            sourceHash: { type: string }
            extractor: { type: string }
            sourceType: { type: string }
            observedAt: { type: string, format: date-time }
        createdRev: { type: integer }
        deletedRev: { type: integer }
    ScoredClaim:
      type: object
      required: [claim, confidence, relevance, finalScore]
      properties:
        claim: { $ref: "#/components/schemas/Claim" }
        confidence: { $ref: "#/components/schemas/ConfidenceBreakdown" }
        relevance: { type: number }
        finalScore: { type: number, description: relevance × confidence }
    StructuredContext:
      type: object
      properties:
        claims: { type: array, items: { $ref: "#/components/schemas/ScoredClaim" } }
        compactClaims: { type: array, items: { type: object } }
        conflicts: { type: array, items: { type: object } }
        decisions: { type: array, items: { type: object } }
        intents: { type: array, items: { type: object } }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
        metadata:
          type: object
          properties:
            query: { type: string }
            seedEntities: { type: array, items: { type: string } }
            hopsExpanded: { type: integer }
            asOfRev: { type: integer }
            depth: { type: string }
    NodeCreationResult:
      type: object
      properties:
        status: { type: string }
        nodeId: { type: string }
        rev: { type: integer }
    CreateNoteRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        tag: { type: string, enum: [finding, decision, reminder, note], default: note }
        actor: { type: string }
        nodeIds: { type: array, items: { type: string } }
        sessionId: { type: string, description: Session name or id }
    Note:
      type: object
      required: [id, text, tag, nodeIds, at, stale]
      properties:
        id: { type: string }
        text: { type: string }
        tag: { type: string }
        actor: { type: string, nullable: true }
        nodeIds: { type: array, items: { type: string } }
        at: { type: string, description: ISO timestamp }
        stale: { type: boolean }
        staleReason: { type: string, nullable: true }
    NoteSearchResult:
      allOf:
        - $ref: "#/components/schemas/Note"
        - type: object
          properties:
            sessionId: { type: string, nullable: true }
            sessionName: { type: string, nullable: true }
            lifecycleStatus: { type: string, nullable: true }
            supersedes: { type: array, nullable: true, items: { type: string } }
            supersededBy: { type: array, nullable: true, items: { type: string } }
    SupersedeNoteResult:
      type: object
      properties:
        status: { type: string, enum: [superseded] }
        oldNoteId: { type: string }
        newNote: { $ref: "#/components/schemas/Note" }
    RetractNoteResult:
      type: object
      properties:
        status: { type: string, enum: [retracted] }
        noteId: { type: string }
    SessionInfo:
      type: object
      required: [sessionId, name, purpose, actor, actors, ttlHours, createdAt]
      properties:
        sessionId: { type: string }
        name: { type: string }
        purpose: { type: string }
        actor: { type: string }
        actors: { type: array, items: { type: string } }
        ttlHours: { type: integer }
        createdAt: { type: string }
        lastLoadedAt: { type: string, nullable: true }
    CreateSessionRequest:
      type: object
      required: [purpose, actor]
      properties:
        purpose: { type: string }
        actor: { type: string }
        ttlHours: { type: integer, default: 24 }
        name: { type: string, description: Generated when absent }
    PinSessionResult:
      type: object
      properties:
        status: { type: string, enum: [pinned] }
        count: { type: integer }
    DeleteSessionResult:
      type: object
      properties:
        status: { type: string, enum: [deleted] }
    PatchSummary:
      type: object
      properties:
        patch_id: { type: string }
        rev: { type: integer }
        intent: { type: string }
        source_uri: { type: string }
        timestamp: { type: string }
    PatchSource:
      type: object
      required: [uri, extractor, sourceType]
      properties:
        uri: { type: string, description: Workspace-relative path; opaque join key }
        sourceHash: { type: string }
        extractor: { type: string }
        sourceType: { type: string }
        workspaceId: { type: string, description: SHA-256 of the workspace root path }
    # The op shapes, node kinds and edge predicates below mirror
    # core-ingestion/src/schema.ts (copied to ix-cli/src/client/graph-schema.ts);
    # ix-cli/src/client/__tests__/graph-schema.test.ts checks they agree.
    NodeKind:
      type: string
      description: |
        Every node kind a patch from the ix CLI writes. Symbol nodes come from
        the parser, which writes struct, enum, record, union, impl, type alias
        and annotation definitions as `class`.
      enum:
        [file, module, class, interface, trait, function, method, constant, macro,
         table, view, label, config, config_entry, frontmatter, heading, section,
         environment, chunk, intent, doc, decision]
    EdgePredicate:
      type: string
      description: Every edge predicate a patch from the ix CLI writes.
      enum: [CONTAINS, CALLS, IMPORTS, EXTENDS, REFERENCES, CONTAINS_CHUNK, DEFINES, NEXT]
    UpsertNodeOp:
      type: object
      description: |
        Create or replace a node. `attrs` is an open map. Symbol and file nodes
        carry `line_start` / `line_end` / `language` / `role`; chunk nodes carry
        `file_uri`, `chunk_kind`, `start_line` / `end_line`, `start_byte` /
        `end_byte`, `content_hash` and `parser_version`.
      required: [type, id, kind, name, attrs]
      properties:
        type: { type: string, enum: [UpsertNode] }
        id: { type: string }
        kind: { $ref: "#/components/schemas/NodeKind" }
        name: { type: string }
        attrs: { type: object, additionalProperties: true }
    UpsertEdgeOp:
      type: object
      description: |
        Create or replace an edge. `attrs` is an open map; an edge resolved to
        another file carries `confidence` and `tier`.
      required: [type, id, src, dst, predicate, attrs]
      properties:
        type: { type: string, enum: [UpsertEdge] }
        id: { type: string }
        src: { type: string, description: Source node id }
        dst: { type: string, description: Destination node id }
        predicate: { $ref: "#/components/schemas/EdgePredicate" }
        attrs: { type: object, additionalProperties: true }
    DeleteNodeOp:
      type: object
      description: Retire a node by id.
      required: [type, id]
      properties:
        type: { type: string, enum: [DeleteNode] }
        id: { type: string }
    DeleteEdgeOp:
      type: object
      description: Retire an edge by id.
      required: [type, id]
      properties:
        type: { type: string, enum: [DeleteEdge] }
        id: { type: string }
    AssertClaimOp:
      type: object
      description: Assert a fact about a node, for the confidence and conflict engine.
      required: [type, entityId, field, value, confidence]
      properties:
        type: { type: string, enum: [AssertClaim] }
        entityId: { type: string }
        field: { type: string, description: "`<predicate in lower case>:<target name>`, e.g. `calls:render`" }
        value: { description: The claimed value; the CLI sends the target name. }
        confidence: { type: number, nullable: true, description: Null lets the backend score it }
    RetractClaimOp:
      type: object
      description: Withdraw a claim. The ix CLI does not send one; only `type` is documented here.
      required: [type]
      properties:
        type: { type: string, enum: [RetractClaim] }
      additionalProperties: true
    PatchOp:
      description: One op in a graph patch, told apart by `type`.
      oneOf:
        - $ref: "#/components/schemas/UpsertNodeOp"
        - $ref: "#/components/schemas/UpsertEdgeOp"
        - $ref: "#/components/schemas/DeleteNodeOp"
        - $ref: "#/components/schemas/DeleteEdgeOp"
        - $ref: "#/components/schemas/AssertClaimOp"
        - $ref: "#/components/schemas/RetractClaimOp"
      discriminator:
        propertyName: type
        mapping:
          UpsertNode: "#/components/schemas/UpsertNodeOp"
          UpsertEdge: "#/components/schemas/UpsertEdgeOp"
          DeleteNode: "#/components/schemas/DeleteNodeOp"
          DeleteEdge: "#/components/schemas/DeleteEdgeOp"
          AssertClaim: "#/components/schemas/AssertClaimOp"
          RetractClaim: "#/components/schemas/RetractClaimOp"
    GraphPatchPayload:
      type: object
      required: [patchId, actor, timestamp, source, baseRev, ops, replaces]
      properties:
        patchId: { type: string }
        actor: { type: string }
        timestamp: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/PatchSource" }
        baseRev: { type: integer }
        ops: { type: array, items: { $ref: "#/components/schemas/PatchOp" } }
        replaces: { type: array, items: { type: string } }
        intent: { type: string }
    PatchCommitResult:
      type: object
      properties:
        status: { type: string }
        rev: { type: integer }
    ResetResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
